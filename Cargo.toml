[package]
name = "guvenlikbakici"
version = "0.4.0"
edition = "2024"
description = "Offline repository secret and sensitive-file scanner"
repository = "https://github.com/dRafaleD/repora"
readme = "README.md"
license = "MIT"
default-run = "repora"

[[bin]]
name = "repora"
path = "src/main.rs"

[[bin]]
name = "guvenlikbakici"
path = "src/legacy.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
toml = "0.8"
globset = "0.4"
ureq = { version = "3", features = ["json"] }
crossterm = "0.29"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }

[dev-dependencies]
tempfile = "3"
